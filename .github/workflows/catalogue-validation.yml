name: Catalogue validation

on:
  push:
    branches: [main]
    paths:
      - "books.json"
      - "universal-links.json"
      - "scripts/validate-catalogue.mjs"
      - "package.json"
      - ".github/workflows/catalogue-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "books.json"
      - "universal-links.json"
      - "scripts/validate-catalogue.mjs"
      - "package.json"
      - ".github/workflows/catalogue-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate catalogue and book links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate catalogue
        run: npm test
