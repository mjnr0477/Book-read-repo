name: Build Book Read Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "books.json"
      - "manifest.webmanifest"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "scripts/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: book-read-android-apk
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install

      - name: Prepare bundled website
        run: npm run build:web

      - name: Generate Android project and sync website
        run: |
          npx cap add android
          npx cap sync android

      - name: Remove unrelated Android permissions
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          p = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(p)
          root = tree.getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          blocked = {
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_BACKGROUND_LOCATION",
          }
          for node in list(root):
              if node.tag == "uses-permission" and node.get(android + "name") in blocked:
                  root.remove(node)
          tree.write(p, encoding="utf-8", xml_declaration=True)
          print("Removed unrelated camera, microphone and location permissions.")
          PY
          if grep -E 'android.permission.(CAMERA|RECORD_AUDIO|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|ACCESS_BACKGROUND_LOCATION)' android/app/src/main/AndroidManifest.xml; then
            echo "Unexpected restricted permission remains"
            exit 1
          fi

      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: book-read-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
